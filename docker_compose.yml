version: "3.8"

services:
  app:
    build: .
    container_name: retriever-app
    ports:
      - "8000:8000"   # FastAPI
      - "8501:8501"   # Streamlit
    volumes:
      - .:/app        # 개발 시 코드 변경을 즉시 반영 (선택)
    environment:
      - PYTHONUNBUFFERED=1   # 로그 실시간 출력
    command: >
      bash -c "
        uvicorn api.main:app --host 0.0.0.0 --port 8000 &
        streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
      "